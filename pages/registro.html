<html lang="es">
    <head>
        <title>
            Registro de usuarios
        </title>
        <link rel="stylesheet" type="text/css" href="..//css/estilos.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <form name="registro" method="post" action="../src/Controllers/Registrar_Usuario.php">
            Tipo Usuario <br>
            <select name="tipo">
                <option value="Estudiante">Estudiante</option>
            </select><br>
            <select name="tipo_doc">
                <option value="Cédula">Cédula de Ciudadanía Colombiana</option>
                <option value="TI">Tarjeta de Identidad</option>
                <option value="Pasaporte">Pasaporte</option>
                <option value="CE">Cédula de extranjería</option>
            </select><br>
            Número de Identificación:<br> <input type="text" name="num_id" maxlength="15" required><br>
            Nombres:<br>    <input type="text" name="nombres" maxlength="30" required><br>
            Apellidos:<br>  <input type="text" name="apellidos" maxlength="30" required><br>
            E-mail:<br>   <input type="text" name="e_mail"    maxlength="50"><br>
            <!--Fecha de Nacimiento: <br><input type="date" name="fecha de nacimiento"><br>-->
            password:<br> <input type="password" name="password" maxlength="30" minlength="8" required><br>
            Sexo:<br> Masculino<INPUT TYPE="RADIO" NAME="gender" VALUE="Masculino">
                Femenino<INPUT TYPE="RADIO" NAME="gender" VALUE="Femenino"><BR>
                No binario<INPUT TYPE="RADIO" NAME="gender" VALUE="Femenino"><BR>
            <input type="submit" name="aceptar" value="Registrar">
            <input type="reset" value="Restablecer" name="Borrar">
        </form>    
    </body>
</html>
